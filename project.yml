name: HeartDrive
options:
  bundleIdPrefix: com.ericbriscoe
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "18"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: WJPH3B5Z5U
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HeartDrive:
    type: application
    platform: iOS
    sources:
      - path: HeartDrive/Sources
      - path: HeartDrive/Assets.xcassets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericbriscoe.HeartDrive
        CODE_SIGN_ENTITLEMENTS: HeartDrive/HeartDrive.entitlements
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HeartDrive/Info.plist
      properties:
        CFBundleDisplayName: HeartDrive
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSBluetoothAlwaysUsageDescription: "HeartDrive connects to your smart trainer over Bluetooth to read power and set resistance."
        NSHealthShareUsageDescription: "HeartDrive uses your heart rate to automatically adjust trainer resistance toward your target."
        NSHealthUpdateUsageDescription: "HeartDrive records heart rate as part of your workout."
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
    dependencies:
      - target: HeartDriveWatch
        embed: true

  HeartDriveWatch:
    type: application
    platform: watchOS
    sources:
      - path: HeartDriveWatch/Sources
      - path: HeartDriveWatch/Assets.xcassets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericbriscoe.HeartDrive.watchkitapp
        CODE_SIGN_ENTITLEMENTS: HeartDriveWatch/HeartDriveWatch.entitlements
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HeartDriveWatch/Info.plist
      properties:
        CFBundleDisplayName: HeartDrive
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ericbriscoe.HeartDrive
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "HeartDrive reads your heart rate during a workout to drive trainer resistance."
        NSHealthUpdateUsageDescription: "HeartDrive records heart rate as part of your workout."
